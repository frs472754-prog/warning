<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Error</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background-color: #000;
    font-family: 'VT323', monospace; /* Ретро-шрифт из 90-х/нулевых */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Фон с гифкой */
  .bg-gif {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2NrbnltanljYzB4ejBhczlxY3VmYzJhbGtrdHRscGJpbHN1bnp3eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7SN7VRxzzcby9nyKJV/giphy.gif');
    background-size: cover;
    background-position: center;
    z-index: 0;
    filter: grayscale(100%) contrast(150%) brightness(35%); /* Делаем гифку черно-белой и мрачной */
  }

  /* Легкая шумовая текстура (зерно) поверх фона */
  .noise {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Noise.png');
    opacity: 0.15;
    z-index: 1;
    pointer-events: none;
  }

  /* Баннер */
  .warning-container {
    position: relative;
    z-index: 10;
  }

  .warning {
    position: relative;
    padding: 30px 50px;
    background: rgba(5, 5, 5, 0.8);
    backdrop-filter: blur(3px);
    border: 1px solid #b30000; /* Темно-красный, как рога на аве */
    border-radius: 4px; /* Острые углы для готик-стиля */
    box-shadow: 0 0 25px rgba(179, 0, 0, 0.4);
    text-align: center;
    animation: glitch 4s infinite; /* Легкий эффект глитча */
  }

  /* Анимация глитча для всего баннера */
  @keyframes glitch {
    0%, 100% { transform: translate(0); }
    2% { transform: translate(-1px, 1px); }
    4% { transform: translate(1px, -1px); }
    6% { transform: translate(0); }
  }

  .icon {
    font-size: 40px;
    color: #ff0000;
    text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    display: block;
    margin-bottom: 10px;
    animation: blink 1.5s infinite; /* Мигает */
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .title {
    font-size: 40px;
    letter-spacing: 3px;
    color: #fff;
    margin: 0 0 10px;
    text-transform: uppercase;
    text-shadow: 2px 2px 0px #b30000;
  }

  .divider {
    height: 1px;
    background: #b30000;
    margin: 15px 0;
    box-shadow: 0 0 5px #b30000;
  }

  .nick {
    font-size: 32px;
    color: #e0e0e0;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .sub {
    font-size: 18px;
    color: #b30000;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Сканирующая линия (более тонкая и злая) */
  .scan {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .scan::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #ff0000;
    box-shadow: 0 0 8px #ff0000;
    animation: scan 2.5s linear infinite;
    opacity: 0.7;
  }
  @keyframes scan {
    0%   { top: 0; }
    100% { top: 100%; }
  }
</style>
</head>
<body>

  <div class="bg-gif"></div>
  <div class="noise"></div>

  <div class="warning-container">
    <div class="warning">
      <div class="scan"></div>
      <span class="icon">☠</span> <!-- Заменил на череп, подходит по вайбу -->
      <h1 class="title">System Error</h1>
      <div class="divider"></div>
      <div class="nick">zero.ping/again</div>
      <div class="sub">Connection terminated</div>
    </div>
  </div>

</body>
</html>
