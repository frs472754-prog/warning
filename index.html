<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Breach</title>
<style>
/* Сброс стилей для мобилок */
* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent; /* Убирает синюю рамку при клике на телефоне */
}

body, html {
margin: 0; padding: 0; 
width: 100%; height: 100vh; /* 100vh для мобильных */
background-color: #050510; 
overflow: hidden; /* Запрет прокрутки */
font-family: 'Courier New', Courier, monospace;
position: fixed; /* Фиксируем экран, чтобы не двигался */
top: 0; left: 0;
}

/* --- ЭФФЕКТ УРОНА --- */
.damage-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: radial-gradient(circle, transparent 10%, rgba(255, 0, 0, 0.7) 100%);
z-index: 9998; pointer-events: none; opacity: 0;
}
.damage-overlay.hit {
animation: damageFlash 0.8s ease-out;
}
@keyframes damageFlash {
0% { opacity: 1; }
100% { opacity: 0; }
}

/* --- КАРТИНКА СЕРДЦА --- */
.heart-container {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
z-index: 9999; pointer-events: none;
}

.heart-img {
width: 120px; /* Чуть уменьшил для мобилок */
image-rendering: pixelated;
}

.heart-container.show {
animation: heartPop 1.2s forwards;
}

@keyframes heartPop {
0% { transform: translate(-50%, -50%) scale(0); }
20% { transform: translate(-50%, -50%) scale(1.2); }
30% { transform: translate(-50%, -50%) scale(1) translateX(-10px); }
40% { transform: translate(-50%, -50%) scale(1) translateX(10px); }
50% { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.5); }
60% { transform: translate(-50%, -50%) scale(1); }
100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; filter: blur(5px); }
}

/* --- ФОН: КОСМОС И ГОРЫ --- */
.landscape {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
z-index: 1; overflow: hidden;
background: linear-gradient(to bottom, #050510 0%, #1a0b1c 50%, #3a0e1c 100%);
}
.stars {
position: absolute; top: 0; left: 0; width: 100%; height: 50%;
background-image: radial-gradient(1px 1px at 10% 10%, #fff, transparent), radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 40% 20%, #fff, transparent), radial-gradient(2px 2px at 60% 40%, #fff, transparent), radial-gradient(1px 1px at 80% 10%, #fff, transparent), radial-gradient(1px 1px at 90% 50%, #fff, transparent);
background-size: 200px 200px; opacity: 0.6; animation: twinkle 4s infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.8; } }
.mountains-back {
position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
background: #1a0b1c; clip-path: polygon(0 100%, 0 50%, 15% 20%, 30% 60%, 45% 10%, 60% 50%, 75% 15%, 90% 60%, 100% 30%, 100% 100%);
animation: panBackground 20s linear infinite; z-index: 2;
}
.mountains-front {
position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
background: #2d0614; clip-path: polygon(0 100%, 0 60%, 20% 30%, 35% 70%, 50% 20%, 65% 60%, 80% 25%, 100% 60%, 100% 100%);
animation: panBackground 10s linear infinite; z-index: 3;
}
@keyframes panBackground { 0% { transform: translateX(0); } 100% { transform: translateX(-10%); } }

/* --- ЭФФЕКТ РАЗРЫВА --- */
.glitch-overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none;
background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 4px);
animation: screenGlitch 5s infinite;
  }
@keyframes screenGlitch {
0%, 90%, 100% { transform: translate(0); opacity: 0.3; }
91% { transform: translate(-5px, 2px); opacity: 0.6; }
92% { transform: translate(5px, -2px); opacity: 0.3; }
93% { transform: translate(-2px, 0); opacity: 0.5; }
94% { transform: translate(2px, 1px); opacity: 0.4; }
95% { transform: translate(0); opacity: 0.3; }
}

#threats-container {
position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;
}
.threat-text {
position: absolute; font-weight: 900; font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: 3px; color: #fff; opacity: 0; white-space: nowrap;
text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff;
animation: hologramGlitch 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes hologramGlitch {
0% { opacity: 0; transform: scaleY(0); }
10% { opacity: 1; transform: scaleY(1); }
15% { transform: translateX(-10px) skewX(20deg); }
17% { transform: translateX(10px) skewX(-20deg); }
19% { transform: translateX(-5px) skewX(0); }
21% { transform: translateX(5px) skewX(0); }
75% { opacity: 1; transform: scaleY(1); filter: blur(0); }
100% { opacity: 0; transform: scaleY(0.1) scaleX(1.5); filter: blur(10px); }
}

/* Главное окно (АДАПТИВНОЕ) */
.main-window {
position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
width: 90%; max-width: 380px; 
background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(5px);
border: 2px solid #fff; border-radius: 10px; 
padding: 25px 20px; /* Уменьшил отступы для мобилок */
z-index: 10;
box-shadow: 0 0 60px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1);
color: #fff; text-align: center;
animation: float 4s ease-in-out infinite;
}

@keyframes float { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-10px); } }

.main-window img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; object-fit: cover; margin-bottom: 10px; box-shadow: 0 0 30px #fff; }
.main-window h1 { margin: 0; font-size: 20px; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px #fff; }
.main-window p { color: #aaa; font-size: 13px; line-height: 1.4; margin: 10px 0 20px; }

.button-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }

.btn {
display: flex; align-items: center; justify-content: space-between;
background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid #fff; 
padding: 12px 15px; /* Чуть меньше */
text-decoration: none; font-size: 14px; font-weight: bold; text-transform: uppercase; 
transition: all 0.2s ease;
cursor: pointer; position: relative; overflow: hidden; box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
border-radius: 5px; /* Скруглил для мобилок */
}
.btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #fff; transition: 0.3s; z-index: 1; }
.btn:hover::before { left: 0; }
.btn:hover { box-shadow: 0 0 30px rgba(255, 255, 255, 0.6); color: #000; transform: scale(1.02); }
.btn span { position: relative; z-index: 2; }

/* --- МОДАЛЬНОЕ ОКНО БИОГРАФИИ (АДАПТИВНОЕ) --- */
.bio-modal {
display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
width: 92%; max-width: 400px; /* 92% чтобы влезло на любой экран */
background: #000;
border: 1px solid #fff; border-top: 4px solid #fff;
border-radius: 8px; padding: 15px; z-index: 100;
box-shadow: 0 0 50px rgba(255, 255, 255, 0.2); text-align: left;
font-family: 'Courier New', monospace; 
max-height: 85vh; /* Чтобы не вылезало за экран */
  overflow-y: auto; /* Прокрутка если текст длинный */
}
.bio-modal.show { display: block; animation: terminalOpen 0.3s ease-out forwards; }
@keyframes terminalOpen {
0% { opacity: 0; transform: translate(-50%, -50%) scaleY(0); }
100% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
}

.bio-header {
color: #fff; font-size: 16px; border-bottom: 1px dashed #444; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
}

.bio-content-wrapper {
position: relative; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center;
}

.secret-data { display: none; width: 100%; text-align: left; }
.data-row { margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 6px; }
.label { color: #888; text-transform: uppercase; font-size: 11px; margin-bottom: 3px; display: block;}
.value { color: #fff; font-weight: bold; display: block; font-size: 13px;}
.encrypted { color: #fff; font-family: 'Courier New', monospace; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); }

/* Тряска окна */
.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
10%, 90% { transform: translate(-50%, -50%) translate3d(-2px, 0, 0); }
20%, 80% { transform: translate(-50%, -50%) translate3d(4px, 0, 0); }
30%, 50%, 70% { transform: translate(-50%, -50%) translate3d(-8px, 0, 0); }
40%, 60% { transform: translate(-50%, -50%) translate3d(8px, 0, 0); }
}

.denied-message {
display: none; text-align: center; color: #fff; font-weight: bold; font-size: 16px;
text-shadow: 0 0 10px #fff, 0 0 20px #fff; animation: blinkWhite 0.3s infinite; line-height: 1.5;
}
@keyframes blinkWhite { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.decrypt-btn {
background: #fff; color: #000; border: none; padding: 12px 25px;
font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; cursor: pointer;
text-transform: uppercase; box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
transition: 0.2s; animation: pulse 1.5s infinite; border-radius: 5px;
}
.decrypt-btn:hover { background: #ccc; box-shadow: 0 0 40px rgba(255, 255, 255, 1); }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

.close-btn {
background: transparent; color: #fff; border: 1px solid #fff; padding: 5px 10px;
font-family: 'Courier New', monospace; font-size: 12px; cursor: pointer;
transition: 0.2s; text-transform: uppercase; border-radius: 3px;
}
.close-btn:hover { background: #fff; color: #000; }

.modal-overlay {
display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.85); z-index: 90; backdrop-filter: blur(5px);
}
.modal-overlay.show { display: block; }

.status-bar {
margin-top: 15px; border-top: 1px dashed #444; padding-top: 10px;
font-size: 11px; color: #fff; display: flex; justify-content: space-between;
animation: blinkWhite 2s infinite;
}
</style>
</head>
<body>

<div class="damage-overlay" id="damageOverlay"></div>

<!-- КОНТЕЙНЕР ДЛЯ СЕРДЦА -->
<div class="heart-container" id="heartContainer">
<img class="heart-img" src="https://i.imgur.com/8Q4ZqKq.png" alt="heart">
</div>

<div class="landscape">
<div class="stars"></div>
<div class="mountains-back"></div>
<div class="mountains-front"></div>
</div>

<div class="glitch-overlay"></div>
<div id="threats-container"></div>

<!-- ГЛАВНОЕ ОКНО -->
<div class="main-window" id="mainWindow">
<img src="https://i.imgur.com/lTlIJP7.jpeg" alt="ava">
<h1>CRITICAL BREACH</h1>
<p>Выберите действие:</p>
<div class="button-group">
<a href="https://t.me/WarningZeroPing" target="_blank" class="btn">
<span>Написать в ЛС</span><span>✉️</span>
</a>
<button onclick="startHeartAttack()" class="btn" style="width: 100%;">
<span>Моя биография</span><span>📄</span>
</button>
</div>
</div>

<div class="modal-overlay" id="bioOverlay" onclick="closeBio()"></div>

<!-- ОКНО БИОГРАФИИ -->
<div class="bio-modal" id="bioModal">
<div class="bio-header">
<span>FILE_ACCESS: RESTRICTED</span>
<button class="close-btn" onclick="closeBio()">[ X ]</button>
</div>

<div class="bio-content-wrapper">
<button class="decrypt-btn" id="decryptBtn" onclick="triggerHit()">РАСШИФРОВАТЬ</button>

<div class="secret-data" id="secretData">
<div class="data-row">
<span class="label">Статус / Status:</span>
<span class="value">> АКТИВЕН</span>
</div>
<div class="data-row">
<span class="label">Возраст / Age:</span>
<span class="value encrypted">░▒▓ [ 0x31 0x37 ] ▓▒░</span>
</div>
<div class="data-row">
<span class="label">Имя / Name:</span>
<span class="value encrypted">▓▒░ 0x5A45524F2E50494E47 ░▒▓</span>
</div>
<div class="data-row" style="border-bottom: none;">
<span class="label">Связь / Contact:</span>
<span class="value">@WarningZeroPing</span>
</div>
</div>

<div class="denied-message" id="deniedMessage">
⚠ ОТКАЗ В ДОСТУПЕ ⚠<br>
<span style="font-size: 12px; color: #888;">УРОВЕНЬ УГРОЗЫ ПОВЫШЕН</span>
</div>
</div>

<div class="status-bar">
<span>SYS.OVERRIDE: FALSE</span>
<span>SECURE_LINE</span>
</div>
</div>

<script>
// Летающие угрозы
const threatTexts = ["НАЖМИ БЫСТРЕЕ!", "ДАННЫЕ УКРАДЕНЫ!", "ТВОЙ IP ВИДЕН!", "СИСТЕМА ВЗЛОМАНА", "УГРОЗА: CRITICAL", "ЖМИ НА КНОПКУ!"];
const container = document.getElementById('threats-container');

function spawnThreat() {
const el = document.createElement('div');
el.className = 'threat-text';
el.textContent = threatTexts[Math.floor(Math.random() * threatTexts.length)];

// Ограничиваем появление, чтобы не вылезало за края на телефоне
let topPos = Math.random() * 80 + 10; 
let leftPos = Math.random() * 80 + 10;

// Если попадает в центр, сдвигаем
if (topPos > 30 && topPos < 70 && leftPos > 20 && leftPos < 80) {
leftPos = leftPos < 50 ? 5 : 85; 
}
el.style.top = topPos + '%'; 
el.style.left = leftPos + '%';
el.style.fontSize = (Math.random() * 8 + 16) + 'px'; // Чуть меньше шрифт на мобилках
container.appendChild(el);
setTimeout(() => { el.remove(); }, 3000);
}
setInterval(spawnThreat, 1000); // Чуть реже, чтобы не грузить телефон

const bioModal = document.getElementById('bioModal');
const bioOverlay = document.getElementById('bioOverlay');
const heartContainer = document.getElementById('heartContainer');

function startHeartAttack() {
const damage = document.getElementById('damageOverlay');
damage.classList.add('hit');
heartContainer.classList.add('show');

const mainWin = document.getElementById('mainWindow');
mainWin.style.animation = 'shake 0.5s';
setTimeout(() => { mainWin.style.animation = ''; }, 500);

setTimeout(() => {
bioModal.classList.add('show');
bioOverlay.classList.add('show');
resetBio();
heartContainer.classList.remove('show');
}, 1200);
}

function closeBio() {
bioModal.classList.remove('show');
bioOverlay.classList.remove('show');
}

function resetBio() {
document.getElementById('decryptBtn').style.display = 'block';
  document.getElementById('deniedMessage').style.display = 'none';
document.getElementById('secretData').style.display = 'none';
document.querySelector('.bio-header span').textContent = 'FILE_ACCESS: RESTRICTED';
document.querySelector('.status-bar span:first-child').textContent = 'SYS.OVERRIDE: FALSE';
}

function triggerHit() {
const modal = document.getElementById('bioModal');
const decryptBtn = document.getElementById('decryptBtn');
const damage = document.getElementById('damageOverlay');

modal.classList.add('shake');
damage.classList.add('hit');

setTimeout(() => {
decryptBtn.style.display = 'none';
document.getElementById('deniedMessage').style.display = 'block';
document.querySelector('.bio-header span').textContent = 'CRITICAL_ERROR: ACCESS_DENIED';
document.querySelector('.status-bar span:first-child').textContent = 'FIREWALL: ACTIVE';
}, 200);

setTimeout(() => {
modal.classList.remove('shake');
damage.classList.remove('hit');
}, 600);
}
</script>
</body>
</html>
