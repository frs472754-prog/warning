<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zero.ping // Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100vh;
    background-color: #050508; overflow: hidden;
    font-family: 'Courier Prime', monospace;
    position: fixed; top: 0; left: 0;
    cursor: none;
  }

  /* --- КУРСОР --- */
  .cursor-glow {
    position: fixed; width: 20px; height: 20px;
    border: 1px solid #ffb7c5; border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s ease, height 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    box-shadow: 0 0 15px #ffb7c5, inset 0 0 10px #ffb7c5;
    mix-blend-mode: screen;
    will-change: left, top, width, height;
  }
  .cursor-glow.hover {
    width: 44px; height: 44px;
    background: rgba(255, 183, 197, 0.15);
    border-color: #fff;
    box-shadow: 0 0 25px #ffb7c5, inset 0 0 18px #ffb7c5;
  }

  /* --- ФОН: ГИФКА + ДОЖДЬ --- */
  .bg-gif {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background-image: url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2NrbnltanljYzB4ejBhczlxY3VmYzJhbGtrdHRscGJpbHN1bnp3eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7SN7VRxzzcby9nyKJV/giphy.gif');
    background-size: cover; background-position: center;
    z-index: 1;
    filter: grayscale(100%) brightness(30%) contrast(120%);
    opacity: 0.6;
    transition: opacity 1s ease, filter 1s ease;
  }
  .bg-night {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(17, 17, 34, 0.4) 0%, rgba(5, 5, 8, 0.9) 100%);
    z-index: 2; transition: background 1.2s ease;
  }

  /* --- ДОЖДЬ --- */
  .rain-container {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 3; pointer-events: none; overflow: hidden;
  }
  .drop {
    position: absolute; top: -20px; width: 1px; height: 80px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 183, 197, 0.6));
    animation: rainFall linear infinite;
  }
  @keyframes rainFall {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(100vh); }
  }

  /* --- РАЗРЫВ: ЕСТЕСТВЕННАЯ ТРЕЩИНА --- */
  .rift-container {
    position: absolute; top: 8%; right: 3%; width: 220px; height: 80%;
    z-index: 4; pointer-events: none;
    filter: drop-shadow(0 0 25px rgba(255, 183, 197, 0.55)) drop-shadow(0 0 60px rgba(255, 183, 197, 0.25));
    animation: riftBreath 4s ease-in-out infinite alternate;
  }
  @keyframes riftBreath {
    0%   { filter: drop-shadow(0 0 15px rgba(255,183,197,0.35)) drop-shadow(0 0 40px rgba(255,183,197,0.15)); }
    100% { filter: drop-shadow(0 0 35px rgba(255,183,197,0.75)) drop-shadow(0 0 90px rgba(255,183,197,0.35)); }
  }

  .rift-svg { width: 100%; height: 100%; display: block; }

  /* Внутренняя тёмная «пустота» разрыва */
  .rift-void {
    fill: #000;
    stroke: #ffb7c5;
    stroke-width: 0.6;
    stroke-linejoin: round;
  }

  /* Слой с символами — обрезается по форме трещины */
  .rift-chars-layer {
    position: absolute; inset: 0;
    clip-path: url(#riftClip);
    -webkit-clip-path: url(#riftClip);
    overflow: hidden;
    display: flex;
    justify-content: space-around;
    padding: 0 14%;
    opacity: 0.95;
  }
  .rift-col {
    color: #ffb7c5;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.05;
    text-shadow: 0 0 6px #ffb7c5, 0 0 14px rgba(255,183,197,0.6);
    display: flex; flex-direction: column; align-items: center;
    will-change: transform;
    user-select: none;
  }
  .rift-col span {
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease;
    will-change: transform, opacity;
  }

  /* --- АНИМЕ-ГЛАЗ (ХИЩНЫЙ) --- */
  .eye-container {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    width: 340px; height: 200px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    filter: drop-shadow(0 0 40px rgba(255, 20, 40, 0.6));
  }
  .eye-container.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Форма глаза — «хищный» разрез */
  .eye-shape {
    position: absolute; inset: 0;
    background: #000;
    border-radius: 50% / 60% 60% 40% 40%;
    clip-path: polygon(
      0% 50%, 8% 38%, 20% 28%, 35% 22%, 50% 20%, 65% 22%,
      80% 28%, 92% 38%, 100% 50%,
      92% 62%, 80% 72%, 65% 78%, 50% 80%, 35% 78%,
      20% 72%, 8% 62%
    );
    overflow: hidden;
    box-shadow: inset 0 0 40px #000, inset 0 0 80px rgba(255,0,0,0.25);
  }

  /* Радужка */
  .iris {
    position: absolute; top: 50%; left: 50%;
    width: 120px; height: 120px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%, #ff3b3b 0%, #c40000 35%, #7a0000 65%, #2a0000 100%);
    box-shadow:
      0 0 30px rgba(255, 0, 0, 0.8),
      inset 0 0 25px rgba(0, 0, 0, 0.7),
      inset 0 0 8px #ff8080;
    animation: irisPulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes irisPulse {
    0%   { box-shadow: 0 0 25px rgba(255,0,0,0.7), inset 0 0 25px rgba(0,0,0,0.7), inset 0 0 8px #ff8080; }
    100% { box-shadow: 0 0 60px rgba(255,0,0,1),  inset 0 0 25px rgba(0,0,0,0.7), inset 0 0 14px #ffb0b0; }
  }

  /* Вертикальный зрачок-щель */
  .pupil {
    position: absolute; top: 50%; left: 50%;
    width: 14px; height: 78px;
    transform: translate(-50%, -50%);
    background: #000;
    border-radius: 50%;
    box-shadow: 0 0 18px #000, inset 0 0 6px #300;
    animation: pupilDilate 3.2s ease-in-out infinite;
  }
  @keyframes pupilDilate {
    0%, 100% { width: 14px; height: 78px; }
    50%      { width: 10px; height: 66px; }
  }

  /* Блик */
  .iris-shine {
    position: absolute; top: 30%; left: 32%;
    width: 26px; height: 22px;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0.5) 50%, transparent 75%);
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(1px);
  }
  .iris-shine.small {
    top: 58%; left: 62%; width: 12px; height: 10px; opacity: 0.6;
  }

  /* Верхнее веко (лёгкая тень) */
  .eyelid {
    position: absolute; top: 0; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    pointer-events: none;
  }

  /* Сетка/прожилки */
  .veins {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 60%, rgba(255,60,60,0.25), transparent 18%),
      radial-gradient(circle at 82% 40%, rgba(255,60,60,0.22), transparent 16%),
      radial-gradient(circle at 50% 15%, rgba(255,60,60,0.18), transparent 20%);
    mix-blend-mode: screen;
    opacity: 0.7;
    animation: veinsShift 5s ease-in-out infinite alternate;
  }
  @keyframes veinsShift {
    0% { opacity: 0.4; }
    100% { opacity: 0.85; }
  }

  /* --- ГЛАВНОЕ ОКНО --- */
  .main-window {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90%; max-width: 380px;
    background: rgba(10, 10, 15, 0.42);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: 1px solid rgba(255, 183, 197, 0.5);
    border-radius: 16px;
    padding: 35px 25px; z-index: 10;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 183, 197, 0.1);
    color: #fff; text-align: center;
    animation: windowBreath 7s ease-in-out infinite;
    transition: opacity 0.6s ease, box-shadow 0.4s ease;
    will-change: transform;
  }
  @keyframes windowBreath {
    0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
    50%      { transform: translate(-50%, -50%) translateY(-6px) rotate(-0.3deg); }
  }

  .avatar-container {
    position: relative; width: 90px; height: 90px; margin: 0 auto 15px auto;
    border-radius: 50%; padding: 3px;
    background: linear-gradient(45deg, #ffb7c5, #fff, #ffb7c5);
    background-size: 200% 200%;
    animation: gradientBorder 3s linear infinite;
  }
  @keyframes gradientBorder {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .main-window img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: #000;
  }

  .main-window h1 {
    margin: 0; font-size: 26px; letter-spacing: 5px; color: #fff;
    text-shadow: 0 0 15px rgba(255, 183, 197, 0.8);
    font-weight: 700; font-family: 'Playfair Display', serif;
  }
  .subtitle-ru {
    font-size: 12px; color: #ffb7c5; margin: 5px 0 30px; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0.8;
  }

  .button-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }

  /* --- КНОПКИ: ПЛАВНАЯ ПОДСВЕТКА --- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255, 255, 255, 0.03); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px 20px; text-decoration: none;
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    cursor: none; position: relative; overflow: hidden;
    border-radius: 8px; letter-spacing: 2px;
    backdrop-filter: blur(5px);
    transition:
      background 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      border-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      letter-spacing 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, box-shadow;
  }

  /* Плавный «световой» блик */
  .btn::before {
    content: '';
    position: absolute; top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 183, 197, 0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }

  /* Мягкое свечение по контуру */
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 8px;
    box-shadow: 0 0 0 rgba(255, 183, 197, 0);
    transition: box-shadow 0.45s ease;
    pointer-events: none;
  }

  .btn:hover {
    background: rgba(255, 183, 197, 0.12);
    border-color: #ffb7c5;
    color: #fff;
    letter-spacing: 3px;
    transform: translateY(-2px);
  }
  .btn:hover::before { left: 160%; }
  .btn:hover::after  { box-shadow: 0 0 28px rgba(255, 183, 197, 0.55); }

  .btn:active { transform: translateY(0) scale(0.985); }

  /* --- БИОГРАФИЯ --- */
  .bio-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 92%; max-width: 400px; background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid #ffb7c5; border-top: 4px solid #ffb7c5;
    border-radius: 12px; padding: 25px; z-index: 100;
    box-shadow: 0 0 50px rgba(255, 183, 197, 0.3); text-align: left;
    font-family: 'Courier Prime', monospace; max-height: 85vh; overflow-y: auto;
  }
  .bio-modal.show { display: block; animation: terminalOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  @keyframes terminalOpen {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .bio-header {
    color: #ffb7c5; font-size: 18px; border-bottom: 1px dashed rgba(255, 183, 197, 0.3);
    padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between;
    align-items: center; font-weight: bold;
  }
  .bio-content-wrapper {
    position: relative; min-height: 200px; display: flex;
    flex-direction: column; justify-content: center; align-items: center;
  }
  .secret-data { display: none; width: 100%; text-align: left; }
  .data-row { margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
  .label { color: #ffb7c5; text-transform: uppercase; font-size: 12px; margin-bottom: 4px; display: block; letter-spacing: 1px; }
  .value { color: #fff; font-weight: bold; display: block; font-size: 14px; }
  .encrypted { color: #ffb7c5; font-family: 'Courier Prime', monospace; letter-spacing: 2px; }

  .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate(-50%, -50%) translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate(-50%, -50%) translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate(-50%, -50%) translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate(-50%, -50%) translate3d(8px, 0, 0); }
  }
  .denied-message {
    display: none; text-align: center; color: #ff4444; font-weight: bold; font-size: 18px;
    text-shadow: 0 0 15px #ff4444; animation: blinkRed 0.4s infinite; line-height: 1.6;
  }
  @keyframes blinkRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .decrypt-btn {
    background: #ffb7c5; color: #000; border: none; padding: 15px 30px;
    font-family: 'Courier Prime', monospace; font-size: 15px; font-weight: bold; cursor: pointer;
    text-transform: uppercase; box-shadow: 0 0 20px rgba(255, 183, 197, 0.6);
    transition: 0.3s; border-radius: 8px; letter-spacing: 2px;
  }
  .decrypt-btn:hover { background: #fff; box-shadow: 0 0 40px rgba(255, 255, 255, 1); transform: scale(1.05); }
  .close-btn {
    background: transparent; color: #ffb7c5; border: 1px solid #ffb7c5; padding: 5px 12px;
    font-family: 'Courier Prime', monospace; font-size: 14px; cursor: pointer;
    transition: 0.2s; text-transform: uppercase; border-radius: 4px;
  }
  .close-btn:hover { background: #ffb7c5; color: #000; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); z-index: 90; backdrop-filter: blur(10px);
  }
  .modal-overlay.show { display: block; }
  .status-bar {
    margin-top: 20px; border-top: 1px dashed rgba(255, 183, 197, 0.2); padding-top: 15px;
    font-size: 11px; color: #ffb7c5; display: flex; justify-content: space-between;
    animation: blinkWhite 3s infinite; letter-spacing: 1px;
  }
  @keyframes blinkWhite { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* --- СЕРДЦЕ И УРОН --- */
  .heart-container {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
    z-index: 9999; pointer-events: none;
  }
  .heart-img { width: 120px; image-rendering: pixelated; }
  .heart-container.show { animation: heartPop 1.2s forwards; }
  @keyframes heartPop {
    0%   { transform: translate(-50%, -50%) scale(0); }
    20%  { transform: translate(-50%, -50%) scale(1.2); }
    30%  { transform: translate(-50%, -50%) scale(1) translateX(-15px); }
    40%  { transform: translate(-50%, -50%) scale(1) translateX(15px); }
    50%  { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.5); }
    60%  { transform: translate(-50%, -50%) scale(1); }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; filter: blur(8px); }
  }
  .damage-overlay {
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 10%, rgba(255, 0, 0, 0.6) 100%);
    z-index: 9998; pointer-events: none; opacity: 0;
  }
  .damage-overlay.hit { animation: damageFlash 0.8s ease-out; }
  @keyframes damageFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Мобильная адаптация */
  @media (max-width: 600px) {
    .rift-container { right: -18%; opacity: 0.55; width: 160px; }
    .main-window { background: rgba(10, 10, 15, 0.62); }
    .eye-container { width: 260px; height: 150px; }
    .iris { width: 90px; height: 90px; }
    .pupil { height: 58px; width: 11px; }
  }
</style>
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="damage-overlay" id="damageOverlay"></div>

  <!-- ФОН: ГИФКА -->
  <div class="bg-gif" id="bgGif"></div>
  <div class="bg-night" id="bgNight"></div>

  <!-- ДОЖДЬ -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- РАЗРЫВ: ЕСТЕСТВЕННАЯ ТРЕЩИНА -->
  <div class="rift-container">
    <!-- SVG-маска для рваных краёв -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <clipPath id="riftClip" clipPathUnits="objectBoundingBox">
          <path d="
            M0.50,0.00
            L0.62,0.04 L0.55,0.08 L0.70,0.12 L0.58,0.16
            L0.74,0.21 L0.60,0.25 L0.78,0.30 L0.62,0.34
            L0.82,0.39 L0.66,0.44 L0.86,0.49 L0.68,0.54
            L0.88,0.59 L0.70,0.64 L0.86,0.69 L0.68,0.74
            L0.84,0.79 L0.66,0.84 L0.80,0.89 L0.62,0.94
            L0.72,0.98 L0.55,1.00
            L0.42,0.96 L0.50,0.92 L0.36,0.88 L0.48,0.84
            L0.32,0.80 L0.44,0.76 L0.28,0.72 L0.42,0.68
            L0.24,0.64 L0.40,0.60 L0.20,0.56 L0.38,0.52
            L0.16,0.48 L0.36,0.44 L0.14,0.40 L0.34,0.36
            L0.16,0.32 L0.36,0.28 L0.18,0.24 L0.38,0.20
            L0.22,0.16 L0.40,0.12 L0.26,0.08 L0.42,0.04
            Z" />
        </clipPath>
      </defs>
    </svg>

    <svg class="rift-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="rift-void" d="
        M50,0
        L62,4 L55,8 L70,12 L58,16
        L74,21 L60,25 L78,30 L62,34
        L82,39 L66,44 L86,49 L68,54
        L88,59 L70,64 L86,69 L68,74
        L84,79 L66,84 L80,89 L62,94
        L72,98 L55,100
        L42,96 L50,92 L36,88 L48,84
        L32,80 L44,76 L28,72 L42,68
        L24,64 L40,60 L20,56 L38,52
        L16,48 L36,44 L14,40 L34,36
        L16,32 L36,28 L18,24 L38,20
        L22,16 L40,12 L26,8 L42,4 Z" />
    </svg>

    <div class="rift-chars-layer" id="riftChars"></div>
  </div>

  <div class="heart-container" id="heartContainer">
    <img class="heart-img" src="https://i.imgur.com/8Q4ZqKq.png" alt="heart">
  </div>

  <!-- АНИМЕ-ГЛАЗ -->
  <div class="eye-container" id="eyeContainer">
    <div class="eye-shape">
      <div class="veins"></div>
      <div class="iris">
        <div class="iris-shine"></div>
        <div class="iris-shine small"></div>
        <div class="pupil"></div>
      </div>
      <div class="eyelid"></div>
    </div>
  </div>

  <!-- ГЛАВНОЕ ОКНО -->
  <div class="main-window" id="mainWindow">
    <div class="avatar-container">
      <img src="https://i.imgur.com/lTlIJP7.jpeg" alt="ava">
    </div>

    <h1>ZERO.PING</h1>
    <p class="subtitle-ru">СИСТЕМА АКТИВНА</p>

    <div class="button-group">
      <button onclick="triggerEyeSequence()" class="btn">
        <span>НАПИСАТЬ В ЛС</span>
      </button>
      <button onclick="startHeartAttack()" class="btn" style="width: 100%;">
        <span>МОЯ БИОГРАФИЯ</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="bioOverlay" onclick="closeBio()"></div>

  <!-- ОКНО БИОГРАФИИ -->
  <div class="bio-modal" id="bioModal">
    <div class="bio-header">
      <span>СЕКРЕТНЫЙ ФАЙЛ</span>
      <button class="close-btn" onclick="closeBio()">[ X ]</button>
    </div>

    <div class="bio-content-wrapper">
      <button class="decrypt-btn" id="decryptBtn" onclick="triggerHit()">РАСШИФРОВАТЬ</button>
