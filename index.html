<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zero.ping // Профиль</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100vh;
    background-color: #0a0a12; overflow: hidden;
    font-family: 'Courier Prime', monospace; /* Строгий шрифт для матрицы */
    position: fixed; top: 0; left: 0;
    cursor: none;
  }

  /* --- КУРСОР И ШЛЕЙФ --- */
  .cursor-glow {
    position: fixed; width: 20px; height: 20px;
    border: 1px solid #ffb7c5; border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.2s;
    box-shadow: 0 0 15px #ffb7c5, inset 0 0 10px #ffb7c5;
    mix-blend-mode: screen;
  }
  
  /* --- ФОН: НОЧЬ И САКУРА --- */
  .bg-night {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to bottom, #0a0a12 0%, #1a1a2e 50%, #16162a 100%);
    z-index: 1; transition: opacity 1s ease;
  }

  .moon {
    position: absolute; top: 15%; right: 15%; width: 100px; height: 100px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 50px 10px rgba(255, 255, 255, 0.3), inset -15px -15px 0 0 rgba(0,0,0,0.2);
    z-index: 2; transition: opacity 1s;
  }

  /* --- СЛОМАННАЯ МАТРИЦА (ЭФФЕКТ ДЫР) --- */
  .matrix-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 4; pointer-events: none; display: flex; flex-wrap: wrap;
    overflow: hidden; opacity: 0.4;
  }
  /* Создаем "дыры" (разрывы), в которых бегут символы */
  .matrix-hole {
    position: absolute;
    overflow: hidden;
    border: 1px solid rgba(255, 183, 197, 0.2);
    box-shadow: inset 0 0 20px rgba(255, 183, 197, 0.2);
    background: rgba(0, 0, 0, 0.6);
    display: flex; flex-direction: column;
  }
  .matrix-column {
    width: 100%; text-align: center; color: #ffb7c5; font-size: 14px;
    text-shadow: 0 0 5px #ffb7c5;
    animation: matrixFall linear infinite;
  }
  @keyframes matrixFall {
    0% { transform: translateY(-100%); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }

  /* Сакура */
  .sakura-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 3; pointer-events: none; overflow: hidden;
  }
  .petal {
    position: absolute; top: -20px; background-color: #ffb7c5;
    border-radius: 15px 0 15px 0;
    opacity: 0.8; box-shadow: 0 0 5px rgba(255, 183, 197, 0.5);
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(100vh) rotate(360deg) translateX(50px); opacity: 0; }
  }

  /* --- ГЛАЗ --- */
  .eye-container {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
    width: 300px; height: 300px; z-index: 50;
    opacity: 0; transition: opacity 1.5s ease, transform 1.5s ease;
    pointer-events: none;
  }
  .eye-container.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .eye {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #ff0000 0%, #8b0000 20%, #000 40%);
    box-shadow: 0 0 100px rgba(255, 0, 0, 0.5), inset 0 0 50px rgba(255, 0, 0, 0.8);
    border: 2px solid #ff0000; animation: eyePulse 2s infinite alternate; position: relative;
  }
  .eye::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 40px; height: 100px; background: #000; border-radius: 50%;
    box-shadow: 0 0 20px #000; animation: pupilMove 3s infinite;
  }
  .eye::before {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px dashed rgba(255, 0, 0, 0.5); animation: spin 5s linear infinite;
  }
  @keyframes eyePulse {
    0% { transform: scale(1); box-shadow: 0 0 50px rgba(255, 0, 0, 0.5); }
    100% { transform: scale(1.05); box-shadow: 0 0 150px rgba(255, 0, 0, 0.8); }
  }
  @keyframes pupilMove {
    0%, 100% { transform: translate(-50%, -50%) scaleX(1); }
    50% { transform: translate(-50%, -50%) scaleX(0.5); }
  }
  @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

  /* --- ГЛАВНОЕ ОКНО --- */
  .main-window {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 380px; 
    background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 183, 197, 0.4); border-radius: 4px;
    padding: 30px 25px; z-index: 10;
    box-shadow: 0 0 30px rgba(255, 183, 197, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
    color: #fff; text-align: center; 
    animation: float 6s ease-in-out infinite; transition: opacity 0.5s;
  }
  @keyframes float { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-10px); } }

  .avatar-container {
    position: relative; width: 85px; height: 85px; margin: 0 auto 15px auto;
    transition: transform 0.3s ease;
  }
  .avatar-container:hover { transform: scale(1.1); }
  .main-window img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 2px solid #ffb7c5; box-shadow: 0 0 15px rgba(255, 183, 197, 0.5);
  }
  .main-window h1 { 
    margin: 0; font-size: 24px; letter-spacing: 4px; color: #fff; 
    text-shadow: 0 0 10px rgba(255, 183, 197, 0.8);
    font-weight: 400; font-family: 'Playfair Display', serif;
  }
  .subtitle-ru { font-size: 14px; color: #ffb7c5; margin: 5px 0 25px; letter-spacing: 2px; }

  .button-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255, 183, 197, 0.05); color: #fff; 
    border: 1px solid rgba(255, 183, 197, 0.5); 
    padding: 14px 20px; text-decoration: none; 
    font-size: 15px; font-weight: normal; text-transform: none; 
    transition: all 0.4s ease; cursor: none; position: relative; 
    border-radius: 2px; letter-spacing: 2px;
  }
  .btn:hover { 
    background: rgba(255, 183, 197, 0.15); box-shadow: 0 0 20px rgba(255, 183, 197, 0.4); 
    border-color: #ffb7c5; color: #ffb7c5;
  }

  /* --- БИОГРАФИЯ --- */
  .bio-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 92%; max-width: 400px; background: rgba(10, 10, 15, 0.98);
    border: 1px solid #ffb7c5; border-top: 3px solid #ffb7c5;
    border-radius: 4px; padding: 20px; z-index: 100;
    box-shadow: 0 0 40px rgba(255, 183, 197, 0.2); text-align: left;
    font-family: 'Courier Prime', monospace; max-height: 85vh; overflow-y: auto;
  }
  .bio-modal.show { display: block; animation: terminalOpen 0.3s ease-out forwards; }
  @keyframes terminalOpen {
    0% { opacity: 0; transform: translate(-50%, -50%) scaleY(0); }
    100% { opacity: 1; transform: translate(-50%, -50%) scaleY(1); }
  }
  .bio-header {
    color: #ffb7c5; font-size: 16px; border-bottom: 1px dashed rgba(255, 183, 197, 0.3); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
  }
  .bio-content-wrapper { position: relative; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .secret-data { display: none; width: 100%; text-align: left; }
  .data-row { margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; }
  .label { color: #ffb7c5; text-transform: uppercase; font-size: 11px; margin-bottom: 3px; display: block;}
  .value { color: #fff; font-weight: bold; display: block; font-size: 13px;}
  .encrypted { color: #ffb7c5; font-family: 'Courier Prime', monospace; letter-spacing: 1px; }

  .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate(-50%, -50%) translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate(-50%, -50%) translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate(-50%, -50%) translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate(-50%, -50%) translate3d(8px, 0, 0); }
  }
  .denied-message {
    display: none; text-align: center; color: #ff4444; font-weight: bold; font-size: 16px;
    text-shadow: 0 0 10px #ff4444; animation: blinkRed 0.4s infinite; line-height: 1.5;
  }
  @keyframes blinkRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .decrypt-btn {
    background: #ffb7c5; color: #000; border: none; padding: 12px 25px;
    font-family: 'Courier Prime', monospace; font-size: 14px; font-weight: bold; cursor: pointer;
    text-transform: uppercase; box-shadow: 0 0 15px rgba(255, 183, 197, 0.5);
    transition: 0.3s; border-radius: 2px;
  }
  .decrypt-btn:hover { background: #fff; box-shadow: 0 0 30px rgba(255, 255, 255, 0.8); }
  .close-btn {
    background: transparent; color: #ffb7c5; border: 1px solid #ffb7c5; padding: 5px 10px;
    font-family: 'Courier Prime', monospace; font-size: 12px; cursor: pointer;
    transition: 0.2s; text-transform: uppercase; border-radius: 2px;
  }
  .close-btn:hover { background: #ffb7c5; color: #000; }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 90; backdrop-filter: blur(5px);
  }
  .modal-overlay.show { display: block; }
  .status-bar {
    margin-top: 15px; border-top: 1px dashed rgba(255, 183, 197, 0.2); padding-top: 10px;
    font-size: 11px; color: #ffb7c5; display: flex; justify-content: space-between;
    animation: blinkWhite 3s infinite;
  }
  @keyframes blinkWhite { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* --- СЕРДЦЕ И УРОН --- */
  .heart-container {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
    z-index: 9999; pointer-events: none;
  }
  .heart-img { width: 100px; image-rendering: pixelated; }
  .heart-container.show { animation: heartPop 1.2s forwards; }
  @keyframes heartPop {
    0% { transform: translate(-50%, -50%) scale(0); }
    20% { transform: translate(-50%, -50%) scale(1.2); }
    30% { transform: translate(-50%, -50%) scale(1) translateX(-10px); }
    40% { transform: translate(-50%, -50%) scale(1) translateX(10px); }
    50% { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.5); }
    60% { transform: translate(-50%, -50%) scale(1); }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; filter: blur(5px); }
  }
  .damage-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, transparent 10%, rgba(255, 0, 0, 0.5) 100%);
    z-index: 9998; pointer-events: none; opacity: 0;
  }
  .damage-overlay.hit { animation: damageFlash 0.8s ease-out; }
  @keyframes damageFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="damage-overlay" id="damageOverlay"></div>

  <!-- СЛОМАННАЯ МАТРИЦА -->
  <div class="matrix-container" id="matrixContainer"></div>

  <div class="heart-container" id="heartContainer">
    <img class="heart-img" src="https://i.imgur.com/8Q4ZqKq.png" alt="heart">
  </div>

  <div class="eye-container" id="eyeContainer">
    <div class="eye"></div>
  </div>

  <div class="bg-night" id="bgNight"></div>
  <div class="moon" id="moon"></div>
  
  <div class="sakura-container" id="sakuraContainer"></div>

  <!-- ГЛАВНОЕ ОКНО -->
  <div class="main-window" id="mainWindow">
    <div class="avatar-container">
      <img src="https://i.imgur.com/lTlIJP7.jpeg" alt="ava">
    </div>
    
    <h1>ZERO.PING</h1>
    <p class="subtitle-ru">СИСТЕМА АКТИВНА</p>
    
    <div class="button-group">
      <button onclick="triggerEyeSequence()" class="btn">
        <span>НАПИСАТЬ В ЛС</span>
      </button>
      <button onclick="startHeartAttack()" class="btn" style="width: 100%;">
        <span>МОЯ БИОГРАФИЯ</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="bioOverlay" onclick="closeBio()"></div>

  <!-- ОКНО БИОГРАФИИ -->
  <div class="bio-modal" id="bioModal">
    <div class="bio-header">
      <span>СЕКРЕТНЫЙ ФАЙЛ</span>
      <button class="close-btn" onclick="closeBio()">[ X ]</button>
    </div>
    
    <div class="bio-content-wrapper">
      <button class="decrypt-btn" id="decryptBtn" onclick="triggerHit()">РАСШИФРОВАТЬ</button>

      <div class="secret-data" id="secretData">
        <div class="data-row">
          <span class="label">Статус:</span>
          <span class="value">> АКТИВЕН</span>
        </div>
        <div class="data-row">
          <span class="label">Возраст:</span>
          <span class="value encrypted">░▒▓ [ 0x31 0x37 ] ▓▒░</span>
        </div>
        <div class="data-row">
          <span class="label">Имя:</span>
          <span class="value encrypted">▓▒░ 0x5A45524F2E50494E47 ░▒▓</span>
        </div>
        <div class="data-row" style="border-bottom: none;">
          <span class="label">Связь:</span>
          <span class="value">@WarningZeroPing</span>
        </div>
      </div>

      <div class="denied-message" id="deniedMessage">
        ⚠ ДОСТУП ЗАПРЕЩЕН ⚠<br>
        <span style="font-size: 12px; color: #ffb7c5;">ОШИБКА СИСТЕМЫ</span>
      </div>
    </div>

    <div class="status-bar">
      <span>СИСТЕМА: ЗАЩИЩЕНА</span>
      <span>БЕЗОПАСНАЯ ЛИНИЯ</span>
    </div>
  </div>

  <script>
    // --- КУРСОР ---
    const cursor = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
    });
    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      cursor.style.left = touch.clientX + 'px'; cursor.style.top = touch.clientY + 'px';
    });
    const interactiveElements = document.querySelectorAll('a, .btn, .avatar-container, .decrypt-btn');
    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width = '40px'; cursor.style.height = '40px';
        cursor.style.background = 'rgba(255, 183, 197, 0.2)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width = '20px'; cursor.style.height = '20px';
        cursor.style.background = 'transparent';
      });
    });

    // --- ПАДАЮЩИЕ ЛЕПЕСТКИ ---
    const sakuraContainer = document.getElementById('sakuraContainer');
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      const size = Math.random() * 8 + 6;
      petal.style.width = size + 'px'; petal.style.height = size + 'px';
      petal.style.left = Math.random() * 100 + 'vw';
      const duration = Math.random() * 4 + 4;
      petal.style.animation = `fall ${duration}s linear forwards`;
      petal.style.animationDelay = Math.random() * 2 + 's';
      petal.style.opacity = Math.random() * 0.5 + 0.3;
      sakuraContainer.appendChild(petal);
      setTimeout(() => { petal.remove(); }, duration * 1000);
    }
    setInterval(createPetal, 300);

    // --- СЛОМАННАЯ МАТРИЦА (СОЗДАНИЕ ДЫР) ---
    const matrixContainer = document.getElementById('matrixContainer');
    const chars = '01!@#$%^&*()_+-=[]{}|;:,.<>?/ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    function createMatrixHole() {
      const hole = document.createElement('div');
      hole.classList.add('matrix-hole');
      
      // Рандомные размеры и позиции дыр
      const width = Math.random() * 60 + 20; // 20 - 80px
      const height = Math.random() * 150 + 50; // 50 - 200px
      
      hole.style.width = width + 'px';
      hole.style.height = height + 'px';
      hole.style.left = Math.random() * 90 + 'vw'; // По всему экрану
      hole.style.top = Math.random() * 90 + 'vh';

      // Создаем внутри колонки с символами
      const numColumns = Math.floor(width / 15); // сколько символов влезет
      for (let i = 0; i < numColumns; i++) {
        const col = document.createElement('div');
        col.classList.add('matrix-column');
        col.style.animationDuration = (Math.random() * 2 + 1) + 's'; // Скорость падения
        col.style.animationDelay = (Math.random() * 2) + 's';
        col.textContent = chars[Math.floor(Math.random() * chars.length)];
        hole.appendChild(col);
      }

      matrixContainer.appendChild(hole);

      // Удаляем дыру через 5 секунд
      setTimeout(() => {
        hole.remove();
      }, 5000);
    }

    // Создаем дыры с матрицей
    setInterval(createMatrixHole, 1000); // Новая дыра каждую секунду

    // --- СЦЕНАРИЙ С ГЛАЗОМ И ЗВУКОМ ---
    function triggerEyeSequence() {
      const mainWindow = document.getElementById('mainWindow');
      const eyeContainer = document.getElementById('eyeContainer');
      const bgNight = document.getElementById('bgNight');
      const moon = document.getElementById('moon');

      playHorrorSound();

      mainWindow.style.opacity = '0';
      moon.style.opacity = '0';
      setTimeout(() => { mainWindow.style.display = 'none'; }, 500);
      bgNight.style.background = 'radial-gradient(circle at 50% 50%, #300000 0%, #000 80%)';

      eyeContainer.classList.add('active');

      setTimeout(() => {
        window.location.href = 'https://t.me/WarningZeroPing';
      }, 3500);
    }

    function playHorrorSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gainNode = ctx.createGain();

        osc1.type = 'sawtooth'; osc2.type = 'sine';

        osc1.frequency.setValueAtTime(50, ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 3);
        osc2.frequency.setValueAtTime(150, ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 3);

        gainNode.gain.setValueAtTime(0, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1);
        gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 3.5);

        osc1.connect(gainNode); osc2.connect(gainNode);
        gainNode.connect(ctx.destination);

        osc1.start(); osc2.start();
        osc1.stop(ctx.currentTime + 3.5); osc2.stop(ctx.currentTime + 3.5);
      } catch (e) { console.log("Звук заблокирован"); }
    }

    // --- БИОГРАФИЯ ---
    const bioModal = document.getElementById('bioModal');
    const bioOverlay = document.getElementById('bioOverlay');
    const heartContainer = document.getElementById('heartContainer');

    function startHeartAttack() {
      const damage = document.getElementById('damageOverlay');
      damage.classList.add('hit');
      heartContainer.classList.add('show');

      const mainWin = document.getElementById('mainWindow');
      mainWin.style.animation = 'shake 0.5s';
      setTimeout(() => { mainWin.style.animation = ''; }, 500);

      setTimeout(() => {
        bioModal.classList.add('show');
        bioOverlay.classList.add('show');
        resetBio();
        heartContainer.classList.remove('show');
      }, 1200);
    }

    function closeBio() {
      bioModal.classList.remove('show');
      bioOverlay.classList.remove('show');
    }

    function resetBio() {
      document.getElementById('decryptBtn').style.display = 'block';
      document.getElementById('deniedMessage').style.display = 'none';
      document.getElementById('secretData').style.display = 'none';
      document.querySelector('.bio-header span').textContent = 'СЕКРЕТНЫЙ ФАЙЛ';
      document.querySelector('.status-bar span:first-child').textContent = 'СИСТЕМА: ЗАЩИЩЕНА';
    }

    function triggerHit() {
      const modal = document.getElementById('bioModal');
      const decryptBtn = document.getElementById('decryptBtn');
      const damage = document.getElementById('damageOverlay');
      
      modal.classList.add('shake');
      damage.classList.add('hit');

      setTimeout(() => {
        decryptBtn.style.display = 'none';
        document.getElementById('deniedMessage').style.display = 'block';
        document.querySelector('.bio-header span').textContent = 'ОШИБКА ДОСТУПА';
        document.querySelector('.status-bar span:first-child').textContent = 'БРАНДМАУЭР: АКТИВЕН';
      }, 200);

      setTimeout(() => {
        modal.classList.remove('shake');
        damage.classList.remove('hit');
      }, 600);
    }
  </script>
</body>
</html>
