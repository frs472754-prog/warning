<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Breach</title>
<style>
body, html {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
background-color: #000;
overflow: hidden;
font-family: 'Courier New', Courier, monospace;
}

/* Падающие символы */
#matrix-bg {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 1;
}

/* Слой для летающих угроз */
#threats-container {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 5;
pointer-events: none; /* Чтобы кнопка под ними оставалась кликабельной */
}

.threat-text {
position: absolute;
color: #ff2b2b;
font-weight: bold;
text-shadow: 0 0 10px rgba(255, 43, 43, 0.8);
/* Анимация: появление, задержка, исчезновение */
animation: flashAndFade 2.5s ease-in-out forwards;
white-space: nowrap;
}

@keyframes flashAndFade {
0% { opacity: 0; transform: scale(0.8) translateY(10px); }
15% { opacity: 1; transform: scale(1) translateY(0); }
75% { opacity: 1; } /* Держим текст видимым 1.5 секунды */
100% { opacity: 0; transform: scale(1.1) translateY(-10px); } /* Плавно растворяется */
}

/* Центральное окно */
.main-window {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 90%;
max-width: 400px;
background: rgba(10, 10, 10, 0.95);
border: 2px solid #333;
border-left: 4px solid #ff2b2b;
padding: 30px 20px;
z-index: 10;
box-shadow: 0 0 50px rgba(255, 43, 43, 0.4);
color: #fff;
text-align: center;
box-sizing: border-box;
}

.main-window img {
width: 80px;
height: 80px;
border-radius: 50%;
border: 3px solid #fff;
object-fit: cover;
margin-bottom: 15px;
box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
}

.main-window h1 {
margin: 0;
font-size: 24px;
letter-spacing: 2px;
color: #fff;
text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.main-window p {
color: #aaa;
font-size: 14px;
line-height: 1.6;
margin: 20px 0;
}

/* Пульсирующая кнопка */
.btn {
display: inline-block;
background: #ff2b2b;
color: #fff;
border: none;
padding: 14px 30px;
text-decoration: none;
font-size: 16px;
font-weight: bold;
text-transform: uppercase;
transition: 0.2s;
box-shadow: 0 0 20px rgba(255, 43, 43, 0.8);
animation: pulseBtn 1.5s infinite;
cursor: pointer;
border-radius: 4px;
}

.btn:hover {
background: #fff;
color: #ff2b2b;
box-shadow: 0 0 40px rgba(255, 255, 255, 1);
transform: scale(1.05);
}

@keyframes pulseBtn {
0% { box-shadow: 0 0 10px rgba(255, 43, 43, 0.5); }
50% { box-shadow: 0 0 30px rgba(255, 43, 43, 1); }
100% { box-shadow: 0 0 10px rgba(255, 43, 43, 0.5); }
}
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<!-- Слой для всплывающих угроз -->
<div id="threats-container"></div>

<!-- Центральное окно -->
<div class="main-window">
<img src="https://i.imgur.com/lTlIJP7.jpeg" alt="ava">
<h1>CRITICAL BREACH</h1>
<p>Your system is compromised.<br>Malicious code is being executed.</p>
<a href="https://t.me/WarningZeroPing" target="_blank" class="btn">СВЯЗАТЬСЯ СО МНОЙ</a>
</div>

<script>
// 1. Эффект Матрицы (падающие символы)
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let x = 0; x < columns; x++) drops[x] = 1;
function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff2b2b';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 35);

    // 2. Всплывающие и исчезающие угрозы
    const threatTexts = [
      "НАЖМИ БЫСТРЕЕ!",
      "ДАННЫЕ УКРАДЕНЫ!",
      "ТВОЙ IP ВИДЕН!",
      "СИСТЕМА ВЗЛОМАНА",
      "УГРОЗА: CRITICAL",
      "ЖМИ НА КНОПКУ!",
      "ПОТЕРЯ ДАННЫХ!",
      "ВРЕМЯ ВЫХОДИТ!"
    ];

    const container = document.getElementById('threats-container');

    function spawnThreat() {
      const el = document.createElement('div');
      el.className = 'threat-text';
      
      // Берем случайный текст
      el.textContent = threatTexts[Math.floor(Math.random() * threatTexts.length)];
      
      // Рандомная позиция по краям (чтобы не перекрывать центр)
      let topPos = Math.random() * 100;
      let leftPos = Math.random() * 100;

      // Если текст появился в центре (где кнопка), сдвигаем его в сторону
      if (topPos > 25 && topPos < 75 && leftPos > 15 && leftPos < 85) {
        leftPos = leftPos < 50 ? 5 : 95; 
      }

      el.style.top = topPos + '%';
      el.style.left = leftPos + '%';
      
      // Случайный размер шрифта для хаоса (от 16 до 28px)
      const size = Math.random() * 12 + 16; 
      el.style.fontSize = size + 'px';

      container.appendChild(el);

      // Удаляем из кода страницы через 2.5 секунды (когда анимация завершится)
      setTimeout(() => {
        el.remove();
      }, 2500);
    }

    // Создаем новую угрозу каждые 800 миллисекунд
    setInterval(spawnThreat, 800);
  </script>
</body>
</html>
